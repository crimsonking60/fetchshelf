# This is an example config.toml file for Fetchshelf. It is not exhaustive, documentation will cover the rest
# of the available options.

mam_id = "replace-with-an-actual-mam_id"
web_host = "0.0.0.0"
web_port = 3157
min_ratio = 2
unsat_buffer = 10
wedge_buffer = 10
add_torrents_stopped = false
search_interval = 15
link_interval = 10
goodreads_interval = 20
audio_types = ["m4b", "m4a", "mp4", "mp3", "ogg"]
ebook_types = ["epub", "pdf", "mobi", "azw3", "azw", "cbz", "cbr"]
exclude_narrator_in_library_dir = false

[[qbittorrent]]
url = "http://localhost:8080" # update this to your qbit web ui URL
username = "admin"
password = "supersecret"

[qbittorrent.on_cleaned] # you can skip the on_cleaned section if you don't want to do anything in qbit when upgrading a book
tags = [ "superseded" ]

# Goodreads lists

[[goodreads_list]]
url = "https://www.goodreads.com/review/list_rss/666-a-completely-made-up-list-URL"

[[goodreads_list.grab]] # A block deciding what torrents to grab from the list, if a torrent matches multiple block the first one is used
cost = "all"
languages = [ "english" ] # you can use the same search filters as for autograb blocks
max_size = "15 MiB"

[[goodreads_list.grab]]
cost = "wedge" # automatically wedge torrents before download, as we have an cost=all block before with a max_size, this will only wedge torrents > 15 MiB
languages = [ "english" ]

# Auto download bookmarked content
[[autograb]] # Get stuff for free when we can
type = "bookmarks"
cost = "free"

[[autograb]] # Get stuff smaller than 30MB with ratio
type = "bookmarks"
cost = "all"
max_size = "30 MiB"

[[autograb]] # Use wedges for the rest, when available
type = "bookmarks"
cost = "try_wedge"

# Tagging - sets tags and/or categories on torrents
[[tag]]
categories = { audio = false, ebook = true }
category = "ebooks"

[[tag]]
categories = { audio = true, ebook = false }
category = "audiobooks"

# Libraries - organizes content based on torrent tags and/or categories

[[library]]
category = "audiobooks"
library_dir = "/data/audiobooks"

[[library]]
category = "ebooks"
library_dir = "/data/ebooks"

