# Publishes the head of develop as ghcr.io/crimsonking60/fetchshelf:develop for testers, after the checks pass.
name: Develop image

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: develop-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/crimsonking60/fetchshelf

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:
    name: Publish develop image
    needs: checks
    # Forks have no access to this image name.
    if: github.repository == 'crimsonking60/fetchshelf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version label
        id: version
        run: echo "version=develop-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: FETCHSHELF_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:develop
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
