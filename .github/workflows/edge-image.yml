# Publishes the head of main as ghcr.io/crimsonking60/fetchshelf:edge for testers, after the checks pass.
name: Edge image

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/crimsonking60/fetchshelf
  # Every architecture the .NET base images support. The Dockerfile cross-compiles, so no emulation is needed.
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:
    name: Publish edge image
    needs: checks
    # Forks have no access to this image name.
    if: github.repository == 'crimsonking60/fetchshelf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version label
        id: version
        run: echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: FETCHSHELF_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:edge
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
