# Publishes the head of main as ghcr.io/crimsonking60/fetchshelf:edge for testers, after the checks pass. The image is
# built while the checks run and pushed by digest only, with no tag, so nobody pulls it by name; once the checks pass,
# :edge is pointed at it, which takes seconds. When the checks fail, :edge stays where it was.
name: Edge image

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/crimsonking60/fetchshelf
  # Every architecture the .NET base images support. The Dockerfile cross-compiles, so no emulation is needed.
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: Build edge image
    # Forks have no access to this image name.
    if: github.repository == 'crimsonking60/fetchshelf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version label
        id: version
        run: echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: FETCHSHELF_VERSION=${{ steps.version.outputs.version }}
          # Pushed without a tag: only the digest names it until the publish job tags it.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  image:
    name: Publish edge image
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the checked image as edge
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE@$DIGEST"
