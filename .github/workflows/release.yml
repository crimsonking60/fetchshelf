# Pushing a vYYYY.MM.N tag is a release. The tagged commit must be on main, and the first "## " section of RELEASES.md
# at that commit must be for the same version. Publishes ghcr.io/crimsonking60/fetchshelf:<version> and :latest, and
# creates the GitHub release: the RELEASES.md section, followed by GitHub's list of the pull requests merged since the
# previous release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/crimsonking60/fetchshelf
  # Every architecture the .NET base images support. The Dockerfile cross-compiles, so no emulation is needed.
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  validate:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and every branch, to tell whether the tagged commit is on main.
          fetch-depth: 0

      - name: Check the tag against main and RELEASES.md
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$'; then
            echo "::error::The tag must be vYYYY.MM.N, such as v2026.11.8, but it is: $TAG"
            exit 1
          fi
          version=${TAG#v}

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points at $(git rev-parse --short HEAD), which is not on main. Tag a commit on main."
            exit 1
          fi

          heading=$(grep -m1 '^## ' RELEASES.md || true)
          heading_version=$(printf '%s\n' "$heading" | sed -E 's/^## +([^ ]+).*/\1/')
          if [ "$heading_version" != "$version" ]; then
            echo "::error::The first heading in RELEASES.md at $TAG must be for $version, but it is: ${heading:-(none)}"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$TAG is already released. A published version is never released again: tag the next one."
            exit 1
          fi

          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml

  release:
    name: Publish release
    needs: [validate, checks]
    # Forks have no access to this image name.
    if: github.repository == 'crimsonking60/fetchshelf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the release notes from RELEASES.md
        run: awk '/^## /{ if (found) exit; found = 1; next } found { print }' RELEASES.md > "$RUNNER_TEMP/notes.md"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: FETCHSHELF_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      # --generate-notes appends the merged pull requests since the previous release to the notes file, grouped as
      # .github/release.yml says.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
