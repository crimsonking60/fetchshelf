# Every push to main is a release. The version and release notes come from the first "## " section of RELEASES.md.
# Publishes ghcr.io/crimsonking60/fetchshelf:<version> and :latest, tags the commit, creates the GitHub release, and
# merges main back into develop.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/crimsonking60/fetchshelf
  # Every architecture the .NET base images support. The Dockerfile cross-compiles, so no emulation is needed.
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    name: Publish release
    needs: checks
    # Forks have no access to this image name.
    if: github.repository == 'crimsonking60/fetchshelf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version and notes from RELEASES.md
        id: release
        run: |
          heading=$(grep -m1 '^## ' RELEASES.md || true)
          if [ -z "$heading" ]; then
            echo "::notice::RELEASES.md lists no release yet, so there is nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(printf '%s\n' "$heading" | sed -E 's/^## +([^ ]+).*/\1/')
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$'; then
            echo "::error::The first heading in RELEASES.md must start with a YYYY.MM.N version, but it is: $heading"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Add a section for the new version at the top of RELEASES.md."
            exit 1
          fi

          awk '/^## /{ if (found) exit; found = 1; next } found { print }' RELEASES.md > "$RUNNER_TEMP/notes.md"

          echo "Releasing $version"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: FETCHSHELF_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Tag the commit and create the GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  back-merge:
    name: Merge main back into develop
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      # Keeps main an ancestor of develop, so the release commit and its notes (and a hotfix) are not lost. When the
      # merge cannot be pushed as is, a pull request does the same job and says why.
      - name: Merge main into develop
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          open_pull_request() {
            echo "::warning::$1 Opening a pull request from main into develop instead."
            existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head main --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "Pull request #$existing is already open."
              return
            fi
            gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
              --title "Merge release $VERSION back into develop" \
              --body "$1 Merge this with a merge commit (not a squash), so main stays an ancestor of develop."
          }

          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop already contains main; nothing to merge."
            exit 0
          fi

          if ! git merge --no-ff origin/main -m "Merge release $VERSION back into develop"; then
            git merge --abort
            open_pull_request "Merging main into develop after release $VERSION has conflicts."
            exit 0
          fi

          if ! git push origin HEAD:develop; then
            open_pull_request "The merge of main into develop after release $VERSION could not be pushed: develop moved on during the release, or branch protection refused it."
            exit 0
          fi

          echo "Merged main into develop."
