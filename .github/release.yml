# How GitHub groups the list of merged pull requests it adds to each release (the release workflow's --generate-notes).
# A pull request goes under the first category whose labels it has.
# https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - invalid
      - duplicate
      - wontfix
  categories:
    - title: Bugs
      labels:
        - bug
    - title: Features
      labels:
        - enhancement
    - title: Accessibility
      labels:
        - accessibility
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
