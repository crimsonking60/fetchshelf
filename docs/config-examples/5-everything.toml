# Fetchshelf example 5 of 5: every option
#
# This file uses every setting Fetchshelf understands, with a comment on each. It is meant to be read,
# not copied as is: several blocks overlap on purpose so each option can be shown. Start from one of the
# smaller examples and take what you need from here.
#
# Reference for every setting: docs/configuration.md
#
# Builds on: 4-targeted-searches.toml.

# =====================================================================================================
# Top-level settings. These must come before the first [section].
# Every one of them can also be set with an environment variable named FETCHSHELF_CONF_<setting>
# (for example FETCHSHELF_CONF_min_ratio), which wins over this file.
# =====================================================================================================

mam_id = "replace-with-your-mam-session-id" # required for any background job to run
# mam_id_file = "/run/secrets/mam_id"       # alternative to mam_id: read the session id from this file.
                                             # Set one or the other, not both.
web_host = "0.0.0.0"                         # where the web UI listens
web_port = 3157
web_url = "https://fetchshelf.example.net"  # the address notifications link to; without it, messages carry no links

min_ratio = 2        # never download anything that would take the account below this ratio
unsat_buffer = 10    # unsatisfied-snatch slots always left free
wedge_buffer = 3     # freeleech wedges always left unused
add_torrents_stopped = false
download_after_selection = true # start downloading as soon as something is selected; false = wait for the
                                # next scheduled Download run, leaving time to check the Selected page

page_explanations = true # short explanation under each page title in the web UI
job_explanations = true  # short description of each job on the Jobs page

languages = ["English"] # the default 'languages' of every [[autograb]], [[hardcover_list.grab]] and [[follow.grab]] block
                        # that doesn't set its own, and the Search page's starting language. Empty = any.
                        # Not used by [[tag]] rules.

metadata_json = true  # write metadata.json (Audiobookshelf's format) in every library without its own setting
metadata_opf = false  # write metadata.opf (Calibre's format) in every library without its own setting

database_wal = true # SQLite write-ahead log, for a responsive UI during long jobs. Default false;
                    # only turn it on if the database is on a local disk, not a network share (NFS/SMB)

# Intervals are in minutes. 0 means "only when started from the UI".
search_interval = 30     # default for every autograb and snatchlist block
link_interval = 10       # how often finished torrents are scanned and linked

# MAM torrent ids that must never be selected, as strings.
ignore_torrents = ["123456", "234567"]

# Wanted file types per kind of media, best first. A torrent is only downloaded if it has at least one
# of these, only these are linked, and the first-listed type wins when two copies of a book compete.
audio_types = ["m4b", "m4a", "mp4", "mp3", "ogg"]            # audiobooks, periodical audiobooks
ebook_types = ["epub", "azw3", "mobi", "azw", "pdf", "cbz", "cbr"] # ebooks, manga, comics, periodicals
music_types = ["flac", "mp3", "pdf"]                          # musicology
radio_types = ["mp3"]                                         # radio

# Leave "{Narrator}" off audiobook folder names. If the narrator-less folder already exists, the
# narrator form is used so two books never share a folder.
exclude_narrator_in_library_dir = false

# =====================================================================================================
# [search]: the manual Search page in the web UI
# =====================================================================================================
[search]
# Results bigger than this get the "download with wedge" button highlighted.
wedge_over = "100 MiB"

# =====================================================================================================
# [audiobookshelf]: optional. Remove the section to switch the integration off.
# =====================================================================================================
[audiobookshelf]
url = "http://192.168.1.10:13378" # the address you open Audiobookshelf at in a browser
token = "replace-with-your-audiobookshelf-api-token"
interval = 10 # minutes between matching linked books to Audiobookshelf items

# Only when Audiobookshelf sees the library at another path than Fetchshelf does. Like [qbittorrent.path_mapping]:
# Audiobookshelf's path = Fetchshelf's path.
# [audiobookshelf.path_mapping]
# "/audiobooks" = "/data/library/audiobooks"

# =====================================================================================================
# [hardcover]: optional. The API token the [[hardcover_list]] blocks below need. Create it in Hardcover
# under Settings -> Hardcover API, with the permissions read:me, read:library and read:lists.
# =====================================================================================================
[hardcover]
token = "replace-with-your-hardcover-api-token"
# token_file = "/run/secrets/hardcover_token"   # alternative to token: read it from this file.

# =====================================================================================================
# [[qbittorrent]]: repeatable. New downloads go to the FIRST entry; linking runs against all of them.
# =====================================================================================================
[[qbittorrent]]
url = "http://qbittorrent:8080"
username = "admin"
password = "replace-with-your-qbittorrent-admin-password"

# Left: a path as qBittorrent reports it. Right: the same place as Fetchshelf sees it. The longest
# matching prefix wins.
[qbittorrent.path_mapping]
"/downloads" = "/data/torrents"
"/downloads/old" = "/mnt/archive/torrents"

# What to do in qBittorrent to a torrent whose files were retired in favour of a better format. Both
# parts are optional. A category is created in qBittorrent if it does not exist.
[qbittorrent.on_cleaned]
category = "superseded"
tags = ["superseded"]

# The same for a torrent you Unlink from the library yourself; qBittorrent keeps seeding it.
[qbittorrent.on_unlinked]
category = "unlinked"

# Same shape, for a torrent MAM has but whose details Fetchshelf can't read (such as a new media type).
# A category no library uses keeps the Link job from looking it up again on every run.
[qbittorrent.on_invalid_torrent]
category = "invalid"
tags = ["invalid"]

# A second client, here only used for linking torrents that finished on another machine.
[[qbittorrent]]
url = "http://seedbox.example.net:8080"
username = "admin"
password = "replace-with-your-qbittorrent-admin-password"

# =====================================================================================================
# [[autograb]]: repeatable. A scheduled MAM search.
# =====================================================================================================

# This block sets every autograb option and every field of the shared torrent filter. The same filter
# fields are available on [[tag]] and [[snatchlist]] (with limits).
[[autograb]]
# --- autograb-only options ---
type = "new"           # "bookmarks", "freeleech", "new" (alias "torrents"), "mine", or { uploader = <id> }
cost = "ratio"         # "free" (default), "wedge", "try_wedge", "ratio" (alias "all"), "metadata_only",
                       # "metadata_only_add"
query = '"Terry Pratchett"'
search_in = ["author"] # any of: author, description, filenames, file_types, narrator, series, tags, title
sort_by = "newest_first" # "newest_first" (default), "oldest_first", "random", "low_seeders", "low_snatches"
max_pages = 2          # pages of 100 results per run; default 50 for bookmarks/freeleech/mine, else 1
search_interval = 20   # overrides the global search_interval; 0 = only from the UI
unsat_buffer = 15      # overrides the global buffer for this block; needs 'name'
wedge_buffer = 5       # overrides the global buffer for this block; needs 'name'
max_active_downloads = 5 # cap on this block's unfinished downloads; needs 'name'
dry_run = false        # true: do everything except write or download, and only log
mark_removed = false   # true: mark stored torrents MAM no longer has; not for bookmarks
category = "ebooks"    # force this qBittorrent category, overriding [[tag]] rules

# --- shared torrent filter (all fields) ---
name = "Everything-filter example" # label in logs and the UI; required by max_active_downloads
media_type = ["Ebook", "ComicBook"] # Audiobook, Ebook, Musicology, Radio, Manga, ComicBook,
                                    # PeriodicalEbook, PeriodicalAudiobook
# Per main type: true = all categories, false = none, or a list of names. Defaults: audio and ebook
# true, musicology and radio false.
categories = { audio = false, ebook = ["Fantasy", "Science Fiction", "Humor"], musicology = false, radio = false }
languages = ["English", "German"]  # overrides the top-level languages; languages = [] means any language
# true = the flag must be present, false = it must be absent, unlisted flags are ignored. Names:
# crude_language, violence, some_explicit, explicit, abridged, lgbt.
flags = { crude_language = false, violence = false, some_explicit = false, explicit = false, abridged = false, lgbt = false }
min_size = "100 KiB"
max_size = "50 MiB"
exclude_uploader = ["some-uploader", "another-uploader"]
uploaded_after = "2026-01-01"
uploaded_before = "2026-12-31"
min_seeders = 0
max_seeders = 500
min_leechers = 0
max_leechers = 50
min_snatched = 0
max_snatched = 5000
max_authors = 3         # skip anthologies

# The other autograb types and common costs, briefly:
[[autograb]]
name = "Free bookmarks"
type = "bookmarks"
cost = "free"

[[autograb]]
name = "Wedge the rest"
type = "bookmarks"
cost = "wedge"

[[autograb]]
name = "Freeleech, low seeders first"
type = "freeleech"
cost = "try_wedge"
sort_by = "low_seeders"

[[autograb]]
name = "One uploader"
type = { uploader = 12345 }
cost = "all"
sort_by = "low_snatches"

[[autograb]]
name = "My uploads as metadata"
type = "mine"
cost = "metadata_only_add" # also creates a metadata-only entry for torrents not stored yet
sort_by = "random"

# =====================================================================================================
# [[snatchlist]]: repeatable. Reads your snatch lists and refreshes stored torrents; with
# "metadata_only_add" also records the rest as metadata-only entries. Never downloads.
# 'languages', 'uploaded_after' and 'uploaded_before' are not allowed here; the rest of the shared
# filter is.
# =====================================================================================================
[[snatchlist]]
type = "unsat"           # unsat, inact_unsat, seed_unsat, seed_sat, inact_sat, uploads_active
cost = "metadata_only"   # refresh stored torrents only; "metadata_only_add" also adds the rest
max_pages = 20           # snatch list pages to read (default 50); MAM decides their size
search_interval = 60     # overrides the global search_interval
dry_run = false
media_type = ["Audiobook", "Ebook"]
max_size = "10 GiB"

# =====================================================================================================
# [opds]: optional. Serves the ebook libraries as an OPDS catalog at http://<fetchshelf>/opds, for
# e-readers and reading apps. Leave it out to serve nothing; an empty [opds] serves the ebooks in every
# library. Audiobooks are never served.
# No login: only on a trusted network, or behind a reverse proxy that asks for credentials.
# =====================================================================================================
[opds]
libraries = ["Ebooks"]   # [[library]] names whose ebooks to serve; empty or left out = every library

# =====================================================================================================
# [[hardcover_list]]: repeatable. Searches MAM for the books with a reading status on Hardcover, or on
# one of your Hardcover lists. Needs [hardcover]. A book still missing a format is searched for again
# once a day; the Lists page shows what was found.
# =====================================================================================================
[[hardcover_list]]
name = "Want to Read"
status = "want_to_read"  # want_to_read, currently_reading, read, paused, did_not_finish
prefer_format = "audio"  # when both formats are found, download only this one; unset = both
category = "audiobooks"  # qBittorrent category for everything this list downloads; overrides [[tag]] rules
search_interval = 360    # overrides the global search_interval
dry_run = false

# One or more grab blocks, tried in order: a cost plus the shared torrent filter. Metadata-only costs
# are not allowed here.
[[hardcover_list.grab]]
cost = "free"
languages = ["English"]

[[hardcover_list.grab]]
cost = "wedge"
languages = ["English"]
categories = { audio = true, ebook = false }

[[hardcover_list]]
name = "Books to fetch"
list = "books-to-fetch"  # instead of status: the slug of one of your lists, from its address

[[hardcover_list.grab]]
cost = "free"

# =====================================================================================================
# [follow]: optional. Lets series and authors be followed from the Series page, a torrent's page and the
# Torrents page; the Follow job then searches MAM for their missing and new books. What is followed is
# chosen in the web UI, not here.
# =====================================================================================================
[follow]
search_interval = 60     # overrides the global search_interval
searches_per_run = 10    # MAM searches per run at most, one per followed series or author
search_again_after = 24  # hours before the same series or author is searched again
prefer_format = "audio"  # when both formats are found, take only this one; unset = both
category = "audiobooks"  # qBittorrent category for everything it downloads; overrides [[tag]] rules
dry_run = false

# One or more grab blocks, tried in order, as for [[hardcover_list]].
[[follow.grab]]
cost = "free"
categories = { audio = true, ebook = false }

# =====================================================================================================
# [[tag]]: repeatable. The shared filter plus a qBittorrent category and tags for matching downloads.
# Category: first matching rule that sets one. Tags: union over all matching rules.
# Tag rules do NOT use the top-level 'languages': a rule without its own 'languages' matches every
# language, so a book an autograb selected in another language still gets its category.
# =====================================================================================================
[[tag]]
name = "Ebooks"
categories = { audio = false, ebook = true }
category = "ebooks"
tags = ["fetchshelf"]

[[tag]]
name = "Audiobooks"
categories = { audio = true, ebook = false }
category = "audiobooks"
tags = ["fetchshelf"]

[[tag]]
name = "Large files"
min_size = "1 GiB"
tags = ["large"]         # no category: only adds a tag, on top of whichever rule set the category

# =====================================================================================================
# [[library]]: repeatable. First matching library in file order wins.
# Exactly one of 'category' or 'download_dir' per library.
# =====================================================================================================
[[library]]
name = "Audiobooks"
category = "audiobooks"                  # match torrents in this qBittorrent category
library_dir = "/data/library/audiobooks"
method = "hardlink"                      # hardlink, hardlink_or_copy (default), hardlink_or_symlink,
                                         # copy, symlink, no_link (record metadata only)
deny_tags = ["large"]                    # reject torrents with ANY of these tags
audio_types = ["m4b", "mp3"]             # override the global list for this library

[[library]]
name = "Ebooks"
category = "ebooks"
library_dir = "/data/library/ebooks"
method = "hardlink_or_copy"
allow_tags = ["fetchshelf"]              # if not empty, torrents need at least one of these
ebook_types = ["epub", "pdf"]
metadata_opf = true                      # also write a metadata.opf (Calibre's format); default false
metadata_json = false                    # leave out metadata.json (Audiobookshelf's format); default true

[[library]]
name = "Everything else"
download_dir = "/data/torrents/manual"   # match torrents saved under this folder instead
library_dir = "/data/library/other"
method = "symlink"

# =====================================================================================================
# [[notify]]: repeatable. Messages to a phone or a chat when something needs attention.
# 'url' is a secret (topics and webhook URLs often are one); 'url_file' reads it from a file instead.
# 'events': any of mam_refused, rate_limited, job_failing, job_recovered, job_errors, grabbed, linked,
# removed_from_mam, hit_and_run, budget_spent, or ["all"].
# 'format': json (default), ntfy, gotify, discord or apprise.
# =====================================================================================================
[[notify]]
name = "Phone"
url = "https://ntfy.sh/replace-with-a-hard-to-guess-topic"
format = "ntfy"
token = "replace-with-an-ntfy-access-token"   # sent as 'Authorization: Bearer ...'; leave out for an open topic
events = ["mam_refused", "job_failing", "job_recovered", "hit_and_run", "grabbed"]

[[notify]]
name = "Home Assistant"
url = "http://homeassistant:8123/api/webhook/replace-with-the-webhook-id"
# url_file = "/run/secrets/notify_url"         # alternative to 'url': read the URL from this file. Set one or the other.
events = ["all"]
