# Fetchshelf example 5 of 5: every option
#
# This file uses every setting Fetchshelf understands, with a comment on each. The few that exclude
# another one (such as mam_id_file and mam_id) are shown in comments. It is meant to be read,
# not copied as is: several blocks overlap on purpose so each option can be shown. Start from one of the
# smaller examples and take what you need from here.
#
# Reference for every setting: docs/configuration.md
#
# Builds on: 4-targeted-searches.toml.

# =====================================================================================================
# Top-level settings. These must come before the first [section].
# Every one of them can also be set with an environment variable named FETCHSHELF_CONF_<setting>
# (for example FETCHSHELF_CONF_min_ratio), which wins over this file.
# =====================================================================================================

mam_id = "replace-with-your-mam-session-id" # required for any background job to run
# mam_id_file = "/run/secrets/mam_id"       # alternative to mam_id: read the session id from this file.
                                             # Set one or the other, not both.
web_host = "0.0.0.0"                         # where the web UI listens
web_port = 3157
web_url = "https://fetchshelf.example.net"  # the address notifications link to; without it, messages carry no links
allowed_hosts = ["fetchshelf.example.net", "fetchshelf.lan"]  # names Fetchshelf answers to; empty or left out = any

min_ratio = 2        # never download anything that would take the account below this ratio
unsat_buffer = 10    # unsatisfied-snatch slots always left free
wedge_buffer = 3     # freeleech wedges always left unused
add_torrents_stopped = false
download_after_selection = true # start downloading as soon as something is selected; false = wait for the
                                # next scheduled Download run, leaving time to check the Selected page

page_explanations = true # short explanation under each page title in the web UI
job_explanations = true  # short description of each job on the Jobs page
dry_job_buttons = true   # a Dry run button next to Run now for autograbs, every list, Follow and Upgrade

languages = ["English"] # the default 'languages' of every [[autograb]] block and every list's and [follow]'s grab blocks
                        # that doesn't set its own, and the Search page's starting language. Empty = any.
                        # Not used by [[tag]] rules.

metadata_json = true  # write metadata.json (Audiobookshelf's format) in every library without its own setting
metadata_opf = false  # write metadata.opf (Calibre's format) in every library without its own setting
link_method = "hardlink_or_copy" # how files are placed in every library without its own 'method' (default)
split_collections = false        # split a collection into one library book each, in every library without its own setting
covers = 20           # covers per Link run, 0 to 100 (0, the default, writes none): from the books' files, then fetched
                      # from Hardcover (with [hardcover]), Open Library (ISBN) or Audnexus (audiobook ASIN); never MAM.
                      # Its old name, covers_from_mam, still works, with a warning to rename it
metrics = false       # serve Prometheus metrics at /metrics
genres = true         # MAM's genres and fiction/nonfiction: libraries by genre, and genre filters on the pages; default false

database_wal = true # SQLite write-ahead log, for a responsive UI during long jobs. Default false;
                    # only turn it on if the database is on a local disk, not a network share (NFS/SMB)

# Intervals are in minutes. 0 means "only when started from the UI".
search_interval = 30     # default for every autograb, list, [follow] and [upgrade]
link_interval = 10       # how often finished torrents are scanned and linked

# MAM torrent ids that must never be selected, as strings.
ignore_torrents = ["123456", "234567"]

# qBittorrent categories offered on the Torrents and Search pages besides the libraries' ones, for torrents
# that belong in no library. Torrents in them are never linked.
extra_categories = ["seed-only"]

# Wanted file types per kind of media, best first. A torrent is only downloaded if it has at least one
# of these, only these are linked, and the first-listed type wins when two copies of a book compete.
audio_types = ["m4b", "m4a", "mp4", "mp3", "ogg"]            # audiobooks, periodical audiobooks
ebook_types = ["epub", "azw3", "mobi", "azw", "pdf", "cbz", "cbr"] # ebooks, manga, comics, periodicals
music_types = ["flac", "mp3", "pdf"]                          # musicology
radio_types = ["mp3"]                                         # radio

# Leave "{Narrator}" off audiobook folder names. If the narrator-less folder already exists, the
# narrator form is used so two books never share a folder.
exclude_narrator_in_library_dir = false

# =====================================================================================================
# [search]: the manual Search page in the web UI
# =====================================================================================================
[search]
# Results bigger than this get the "Wedge download" button highlighted.
wedge_over = "100 MiB"
covers = false   # a cover in a result's details, from Hardcover, Open Library or Audnexus; never from MAM

# =====================================================================================================
# [audiobookshelf]: optional. Remove the section to switch the integration off.
# =====================================================================================================
[audiobookshelf]
url = "http://192.168.1.10:13378" # the address you open Audiobookshelf at in a browser
token = "replace-with-your-audiobookshelf-api-token"
interval = 10 # minutes between matching linked books to Audiobookshelf items

# Only needed when Audiobookshelf sees the library at another path than Fetchshelf does. Like
# [qbittorrent.path_mapping]: Audiobookshelf's path = Fetchshelf's path.
[audiobookshelf.path_mapping]
"/audiobooks" = "/data/library/audiobooks"

# =====================================================================================================
# [hardcover]: optional. The API token the [[hardcover_list]] blocks below need. Create it in Hardcover
# under Settings -> Hardcover API, with the permissions read:me, read:library and read:lists.
# =====================================================================================================
[hardcover]
token = "replace-with-your-hardcover-api-token"
# token_file = "/run/secrets/hardcover_token"   # alternative to token: read it from this file.

# =====================================================================================================
# [[qbittorrent]]: repeatable. New downloads go to the FIRST entry unless a block's or a [[tag]] rule's
# 'client' names another, or one is chosen on the Search page; linking runs against all of them.
# =====================================================================================================
[[qbittorrent]]
name = "Home"   # what 'client' settings and the Search page's "in qBittorrent" choice refer to it by
url = "http://qbittorrent:8080"
username = "admin"
password = "replace-with-your-qbittorrent-admin-password"

# Left: a path as qBittorrent reports it. Right: the same place as Fetchshelf sees it. The longest
# matching prefix wins.
[qbittorrent.path_mapping]
"/downloads" = "/data/torrents"
"/downloads/old" = "/mnt/archive/torrents"

# What to do in qBittorrent to a torrent whose files were retired in favour of a better format. Both
# parts are optional. A category is created in qBittorrent if it does not exist.
[qbittorrent.on_cleaned]
category = "superseded"
tags = ["superseded"]

# The same for a torrent you Unlink from the library yourself; qBittorrent keeps seeding it.
[qbittorrent.on_unlinked]
category = "unlinked"
tags = ["unlinked"]

# Same shape, for a torrent MAM has but whose details Fetchshelf can't read (such as a new media type).
# A category no library uses keeps the Link job from looking it up again on every run.
[qbittorrent.on_invalid_torrent]
category = "invalid"
tags = ["invalid"]

# A second client, on another machine: it gets what a 'client = "Seedbox"' setting sends it, and its finished
# torrents are linked like the first one's.
[[qbittorrent]]
name = "Seedbox"
url = "http://seedbox.example.net:8080"
username = "admin"
password = "replace-with-your-qbittorrent-admin-password"

# =====================================================================================================
# [[autograb]]: repeatable. A scheduled MAM search.
# =====================================================================================================

# This block sets every autograb option and every field of the shared torrent filter. The same filter
# fields are available on [[tag]].
[[autograb]]
# --- autograb-only options ---
type = "new"           # "bookmarks", "freeleech", "new" (alias "torrents"), "mine", or { uploader = <id> }
cost = "ratio"         # "free" (default), "wedge", "try_wedge", "ratio" (alias "all"), "metadata_only",
                       # "metadata_only_add"
query = '"Terry Pratchett"'
search_in = ["author"] # any of: author, description, filenames, file_types, narrator, series, tags, title
sort_by = "newest_first" # "newest_first" (default), "oldest_first", "random", "low_seeders", "high_seeders",
                         # "low_snatches", "high_snatches", "largest_first", "title"
max_pages = 2          # pages of 100 results per run; default 50 for bookmarks/freeleech/mine, else 1
search_interval = 20   # overrides the global search_interval; 0 = only from the UI
unsat_buffer = 15      # overrides the global buffer for this block; needs 'name'
wedge_buffer = 5       # overrides the global buffer for this block; needs 'name'
max_active_downloads = 5 # cap on this block's selections waiting to be downloaded; needs 'name'
dry_run = false        # true: do everything except write or download, and only log
mark_removed = false   # true: mark stored torrents MAM no longer has; not for bookmarks
category = "ebooks"    # force this qBittorrent category, overriding [[tag]] rules
client = "Home"        # the [[qbittorrent]] 'name' that gets this block's downloads, overriding [[tag]] rules
save_path = "/downloads/pratchett" # where qBittorrent saves them, as qBittorrent sees it; a library must
                                   # accept the folder or the category
description = "New Pratchett ebooks" # shown under the job on the Jobs page and on the Config page

# --- shared torrent filter (all fields) ---
name = "Everything-filter example" # label in logs and the UI; required by max_active_downloads
media_type = ["Ebook", "ComicBook"] # Audiobook, Ebook, Musicology, Radio, Manga, ComicBook,
                                    # PeriodicalEbook, PeriodicalAudiobook
# Per main type: true = all categories, false = none, or a list of names. Defaults: audio and ebook
# true, musicology and radio false.
categories = { audio = false, ebook = ["Fantasy", "Science Fiction", "Humor"], musicology = false, radio = false }
languages = ["English", "German"]  # overrides the top-level languages; languages = [] means any language
# true = the flag must be present, false = it must be absent, unlisted flags are ignored. Names:
# crude_language, violence, some_explicit, explicit, abridged, lgbt.
flags = { crude_language = false, violence = false, some_explicit = false, explicit = false, abridged = false, lgbt = false }
min_size = "100 KiB"
max_size = "50 MiB"
exclude_uploader = ["some-uploader", "another-uploader"]
uploaded_after = "2026-01-01"
uploaded_before = "2026-12-31"
min_seeders = 0
max_seeders = 500
min_leechers = 0
max_leechers = 50
min_snatched = 0
max_snatched = 5000
max_authors = 3         # skip anthologies

# The other autograb types and common costs, briefly:
[[autograb]]
name = "Free bookmarks"
type = "bookmarks"
cost = "free"

[[autograb]]
name = "Wedge the rest"
type = "bookmarks"
cost = "wedge"

[[autograb]]
name = "Freeleech, low seeders first"
type = "freeleech"
cost = "try_wedge"
sort_by = "low_seeders"

[[autograb]]
name = "One uploader"
type = { uploader = 12345 }
cost = "all"
sort_by = "low_snatches"

[[autograb]]
name = "My uploads as metadata"
type = "mine"
cost = "metadata_only_add" # also creates a metadata-only entry for torrents not stored yet
sort_by = "random"

# =====================================================================================================
# [seeding]: optional. Estimates from qBittorrent's seeding time which torrents still need seeding before MAM
# counts them as satisfied, shows it on the Account, Torrents and torrent pages, and holds on_cleaned back.
# =====================================================================================================
[seeding]
seed_hours = 72          # hours of seeding MAM requires; check MAM's rules
within_days = 30         # days after the snatch to reach them in
interval = 60            # minutes between runs; 0 = only from the Jobs page
tag_unsatisfied = "unsatisfied"   # a qBittorrent tag on torrents that still need seeding; left out = no tag
warn_before_removal = true        # ask before Unlink and Remove, and hold on_cleaned back, while unsatisfied

# =====================================================================================================
# [opds]: optional. Serves the ebook libraries as an OPDS catalog at http://<fetchshelf>/opds, for
# e-readers and reading apps. Leave it out to serve nothing; an empty [opds] serves the ebooks in every
# library. Audiobooks are never served.
# Without username and password, anyone who can reach it can download the books: use it on a trusted network.
# =====================================================================================================
[opds]
libraries = ["Ebooks"]   # [[library]] names whose ebooks to serve; empty or left out = every library
username = "reader"      # with a password: the login OPDS readers must give; left out = no login
password = "change-me"   # or password_file = "/run/secrets/opds_password", read like mam_id_file

# =====================================================================================================
# [[hardcover_list]]: repeatable. Searches MAM for the books with a reading status on Hardcover, or on
# one of your Hardcover lists. Needs [hardcover]. A book still missing a format is searched for again
# once a day, and once a week after MAM has had nothing for it for a week; the Lists page shows what was found.
# =====================================================================================================
[[hardcover_list]]
name = "Want to Read"
status = "want_to_read"  # want_to_read, currently_reading, read, paused, did_not_finish
prefer_format = "audio"  # when both formats are found, download only this one; unset = both
category = "audiobooks"  # qBittorrent category for everything this list downloads; overrides [[tag]] rules
client = "Home"          # as for [[autograb]]
save_path = "/downloads/hardcover"
search_interval = 360    # overrides the global search_interval
unsat_buffer = 15        # overrides the global buffers for this list; needs 'name'
wedge_buffer = 5
max_active_downloads = 10
dry_run = false

# One or more grab blocks, tried in order: a cost plus the shared torrent filter. Metadata-only costs
# are not allowed here.
[[hardcover_list.grab]]
cost = "free"
languages = ["English"]

[[hardcover_list.grab]]
cost = "wedge"
languages = ["English"]
categories = { audio = true, ebook = false }

[[hardcover_list]]
name = "Books to fetch"
list = "books-to-fetch"  # instead of status: the slug of one of your lists, from its address

[[hardcover_list.grab]]
cost = "free"

# =====================================================================================================
# [[file_list]]: repeatable. Searches MAM for the books in a CSV or text file, such as a Goodreads or
# StoryGraph export, like a [[hardcover_list]]. The file is read on every run; a missing file fails the
# list's job until it is there.
# =====================================================================================================
[[file_list]]
name = "Wanted books"
path = "wanted-books.txt"  # relative to this file's folder; see wanted-books.txt next to this example
# shelf = "to-read"        # for an export holding every shelf: keep only this one (Goodreads' Exclusive
                           # Shelf, StoryGraph's Read Status)
prefer_format = "ebook"
category = "ebooks"
client = "Home"
save_path = "/downloads/lists"
search_interval = 360
unsat_buffer = 15
wedge_buffer = 5
max_active_downloads = 5
dry_run = false

[[file_list.grab]]
cost = "free"
languages = ["English"]

# =====================================================================================================
# [[bookmarks_list]]: at most one. Shows the MAM bookmarks on the Lists page with what happened to each,
# and selects them through its grab blocks. Commented out here because it can't be configured together
# with the type = "bookmarks" autograb above: both would select the same torrents. Choose one. It takes
# the same settings as [[file_list]], except 'path', 'shelf' and 'prefer_format'.
# =====================================================================================================
# [[bookmarks_list]]
# name = "MAM bookmarks"
# category = "audiobooks"
# search_interval = 60
# max_active_downloads = 5
# dry_run = false
#
# [[bookmarks_list.grab]]   # tried in order; a bookmark goes to the first block that takes it
# cost = "free"
#
# [[bookmarks_list.grab]]
# cost = "wedge"

# =====================================================================================================
# [follow]: optional. Lets series and authors be followed from the Series page, a torrent's page and the
# Torrents page; the Follow job then searches MAM for their missing and new books, and downloads them for those
# set to Auto. What is followed, and what is on Auto, is chosen in the web UI, not here.
# =====================================================================================================
[follow]
search_interval = 60     # overrides the global search_interval
searches_per_run = 10    # MAM searches per run at most, one per series or author on the Following page
search_again_after = 24  # hours before the same series or author is searched again
prefer_format = "audio"  # when both formats are found, take only this one; unset = both
category = "audiobooks"  # qBittorrent category for everything it downloads; overrides [[tag]] rules
client = "Home"          # also for downloads started from the Following page
save_path = "/downloads/follow"
unsat_buffer = 15        # overrides the global buffers for the Follow job
wedge_buffer = 5
max_active_downloads = 10
dry_run = false
audiobookshelf_series = "follow"       # "off" (default), "follow" or "auto": follow every series in
                                       # Audiobookshelf in that mode; needs [audiobookshelf]
audiobookshelf_libraries = ["Audiobooks"] # Audiobookshelf libraries whose series are followed; empty = every book library

# One or more grab blocks, tried in order, as for [[hardcover_list]].
[[follow.grab]]
cost = "free"
categories = { audio = true, ebook = false }

# =====================================================================================================
# [upgrade]: optional. Searches MAM for better formats of books in the library (an m4b for an mp3 copy,
# by the order of the format lists) and selects them; the Clean job then retires the old copy.
# =====================================================================================================
[upgrade]
search_interval = 360       # overrides the global search_interval
searches_per_run = 20       # MAM searches per run at most, one per book
search_again_after = 30     # days before the same book is searched again
libraries = ["Audiobooks"]  # only books in these [[library]] names; unset = every library
client = "Home"
save_path = "/downloads/upgrades"
unsat_buffer = 15           # overrides the global buffers for the Upgrade job
wedge_buffer = 5
max_active_downloads = 10
dry_run = false

# Without [[upgrade.grab]] blocks, only free copies are taken.
[[upgrade.grab]]
cost = "free"

[[upgrade.grab]]
cost = "try_wedge"
max_size = "2 GiB"

# =====================================================================================================
# [bonus]: optional. Spends bonus points without asking: a wedge when one is due, a VIP top-up, then
# upload credit, keeping keep_points back. Without this section no points are ever spent.
# =====================================================================================================
[bonus]
bonus_interval = 120          # minutes between runs: 0, or 60 and up; not the top-level search_interval
keep_points = 55000           # upload credit and VIP only from points above this; a wedge may use them
upload_amounts = [100, 50]    # GB per purchase, largest first; [] buys no upload credit
wedge_every = 24              # hours between wedge purchases; 0 buys none
vip = false                   # top VIP up to the most MAM allows, once a run
max_purchases_per_run = 10
dry_run = true                # log what would be bought, buy nothing

# =====================================================================================================
# [backup]: optional. Copies the database safely while Fetchshelf runs, and before an upgrade changes it.
# Without this section Fetchshelf takes no backups.
# =====================================================================================================
[backup]
folder = "backups"            # relative to the database's folder (/database/backups in Docker); another disk is safer
interval = 1440               # minutes between backups; 0 = only before upgrades and from the Jobs page
keep = 7                      # scheduled backups kept; the oldest go first
before_upgrade = true         # back up when a new version is about to change the database; the last 3 are kept

# =====================================================================================================
# [[tag]]: repeatable. The shared filter plus a qBittorrent category and tags for matching downloads.
# Category: first matching rule that sets one. Tags: union over all matching rules.
# Tag rules do NOT use the top-level 'languages': a rule without its own 'languages' matches every
# language, so a book an autograb selected in another language still gets its category.
# =====================================================================================================
[[tag]]
name = "Ebooks"
categories = { audio = false, ebook = true }
category = "ebooks"
tags = ["fetchshelf"]

[[tag]]
name = "Audiobooks"
categories = { audio = true, ebook = false }
category = "audiobooks"
tags = ["fetchshelf"]

[[tag]]
name = "Large files"
min_size = "1 GiB"
tags = ["large"]         # no category: only adds a tag, on top of whichever rule set the category
client = "Seedbox"       # the first matching rule that sets a client decides it
save_path = "/downloads/large" # the same for the save path, as qBittorrent sees it

# =====================================================================================================
# [[library]]: repeatable. First matching library in file order wins; with genres = true, its genre
# conditions must hold too.
# Exactly one of 'category' or 'download_dir' per library.
# =====================================================================================================
[[library]]
name = "Audiobooks"
category = "audiobooks"                  # match torrents in this qBittorrent category
library_dir = "/data/library/audiobooks"
method = "hardlink"                      # hardlink, hardlink_or_copy (default), hardlink_or_symlink,
                                         # copy, symlink, no_link (record metadata only)
deny_tags = ["large"]                    # reject torrents with ANY of these tags
audio_types = ["m4b", "mp3"]             # override the global list for this library

[[library]]
name = "Military history"                # a library by genre: tried before "Ebooks", which takes the rest
category = "ebooks"
library_dir = "/data/library/military-history"
allow_tags = ["fetchshelf"]
fiction = "nonfiction"                   # "fiction" or "nonfiction": MAM's main category; needs genres = true
allow_genres = ["Military/War", "Historical"] # MAM's genre names; the book needs at least one of them
deny_genres = ["Juvenile"]               # a book with any of these is left to the next library

[[library]]
name = "Ebooks"
category = "ebooks"
library_dir = "/data/library/ebooks"
method = "hardlink_or_copy"
allow_tags = ["fetchshelf"]              # if not empty, torrents need at least one of these
ebook_types = ["epub", "pdf"]
metadata_opf = true                      # also write a metadata.opf (Calibre's format); default false
metadata_json = false                    # leave out metadata.json (Audiobookshelf's format); default true
split_collections = true                 # link a collection of ebooks as one book each; default the global setting
language_in_folder = "other"             # end the folder name with the language for every book not in the first
                                         # top-level 'languages'; default "on_clash": only to keep two editions apart

[[library]]
name = "Comics"
category = "comics"
library_dir = "/data/library/comics"
layout = "series"                        # one folder per series, one renamed file per book, for Komga;
                                         # default "book": one folder per book
oneshots_dir = "_oneshots"               # series layout: where books without a series go (default)
series_json = true                       # series layout: a Mylar series.json per series folder (default)
folder_names = "portable"                # keep out characters Windows refuses, such as ':' and '?'

[[library]]
name = "Everything else"
download_dir = "/data/torrents/manual"   # match torrents saved under this folder instead
library_dir = "/data/library/other"
method = "symlink"
folder_template = "{author}/[{series} #{series_number} - ]{title}" # the folder layout; unset = the default

# =====================================================================================================
# [[notify]]: repeatable. Messages to a phone or a chat when something needs attention.
# 'url' is a secret (topics and webhook URLs often are one); 'url_file' reads it from a file instead.
# 'events': any of mam_refused, rate_limited, job_failing, job_recovered, job_errors, grabbed, linked,
# removed_from_mam, hit_and_run, unsatisfied_not_seeding, budget_spent, bonus_spent, or ["all"].
# 'format': json (default), ntfy, gotify, discord or apprise.
# =====================================================================================================
[[notify]]
name = "Phone"
url = "https://ntfy.sh/replace-with-a-hard-to-guess-topic"
format = "ntfy"
token = "replace-with-an-ntfy-access-token"   # sent as 'Authorization: Bearer ...'; leave out for an open topic
events = ["mam_refused", "job_failing", "job_recovered", "hit_and_run", "grabbed"]

[[notify]]
name = "Home Assistant"
url = "http://homeassistant:8123/api/webhook/replace-with-the-webhook-id"
# url_file = "/run/secrets/notify_url"         # alternative to 'url': read the URL from this file. Set one or the other.
events = ["all"]
