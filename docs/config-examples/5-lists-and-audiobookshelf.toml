# Fetchshelf example 5 of 6: reading lists and Audiobookshelf
#
# Instead of searching, you keep a list of the torrents you want (a Notion database with links to MaM)
# and Fetchshelf looks each one up on MaM. Audiobookshelf is connected so linked books show up there and
# are kept up to date.
#
# Reference for every setting: docs/configuration.md (see "[[notion_list]]", "grab blocks" and
# "[audiobookshelf]").
#
# Builds on: 4-targeted-searches.toml. Next step: 6-everything.toml.

mam_id = "replace-with-your-mam-session-id"

min_ratio = 2
unsat_buffer = 10
wedge_buffer = 3

# Minutes between runs of each list. Lists are slow on purpose: they look up every linked torrent on MaM.
import_interval = 180

audio_types = ["m4b", "m4a", "mp3"]
ebook_types = ["epub", "azw3", "mobi", "pdf"]

[[qbittorrent]]
url = "http://qbittorrent:8080"
username = "admin"
password = "replace-with-your-qbittorrent-admin-password"

[qbittorrent.path_mapping]
"/downloads" = "/data/torrents"

# --- Notion ------------------------------------------------------------------------------------------
# A Notion database whose rows contain links to MaM torrents. The trailing number of each link is taken
# as the MaM torrent id. Ids already known to Fetchshelf are skipped.
[[notion_list]]
name = "Notion wishlist"
data_source = "00000000-0000-0000-0000-000000000000" # the data source id
token = "replace-with-your-notion-integration-token"
mam_fields = ["Audiobook link", "Ebook link"]        # names of the URL properties that hold MaM links
# A list can set its own timing and buffers, overriding the global ones.
search_interval = 120
unsat_buffer = 15
wedge_buffer = 5

# Every list needs at least one grab block. For each linked torrent, blocks are tried IN ORDER and the
# first one whose filter matches decides the cost, so put the most specific block first. A grab block is
# a 'cost' plus the same filter fields an autograb takes.
#
# Block 1: small English files are cheap, pay with ratio.
[[notion_list.grab]]
cost = "all"
languages = ["English"]
max_size = "15 MiB"

# Block 2: bigger English files get a wedge, so they cost no ratio.
[[notion_list.grab]]
cost = "wedge"
languages = ["English"]

# --- A second list, in dry-run mode -------------------------------------------------------------------
# dry_run logs what would be selected without writing or downloading anything. Remove it once the
# results look right.
[[notion_list]]
name = "Notion favourites"
data_source = "11111111-1111-1111-1111-111111111111"
token = "replace-with-your-notion-integration-token"
mam_fields = ["MaM link"]
dry_run = true

[[notion_list.grab]]
cost = "try_wedge"
languages = ["English"]

# --- Audiobookshelf -----------------------------------------------------------------------------------
# Optional. Leave the section out to switch the integration off.
[audiobookshelf]
url = "http://192.168.1.10:13378" # the address you open Audiobookshelf at in a browser
token = "replace-with-your-audiobookshelf-api-token"
interval = 10

# --- Categories and libraries ------------------------------------------------------------------------
[[tag]]
categories = { audio = false, ebook = true }
category = "ebooks"

[[tag]]
categories = { audio = true, ebook = false }
category = "audiobooks"

[[library]]
name = "Audiobooks"
category = "audiobooks"
library_dir = "/data/library/audiobooks"

[[library]]
name = "Ebooks"
category = "ebooks"
library_dir = "/data/library/ebooks"
