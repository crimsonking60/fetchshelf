services:
  fetchshelf:
    build: .
    image: fetchshelf:latest
    container_name: fetchshelf
    ports:
      - "3157:3157"
    volumes:
      - ./docker-data/config:/config
      - ./docker-data/database:/database
    environment:
      PUID: "1000"
      PGID: "1000"
